name: refresh-archive

on:
  schedule: [{ cron: "0 6 * * 1" }]   # Mondays 06:00 UTC
  workflow_dispatch:                  # manual re-arm after inactivity disables cron

permissions:
  contents: write                     # the default token is read-only

# A manual dispatch racing the Monday cron would have both jobs pushing the
# same dated filenames; the second push would be rejected as non-fast-forward.
concurrency:
  group: refresh-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # prepare_quakes.py uses pandas, pyarrow and stdlib urllib.
      # Not duckdb, not requests.
      - run: pip install pandas pyarrow

      # Writes quakes-YYYY-MM-DD.parquet, majors-YYYY-MM-DD.parquet and
      # manifest.json together, then prunes to the newest 3 of each.
      - run: python prepare_quakes.py

      # The retention rule is a client-facing contract, not housekeeping: a
      # browser holding a cached manifest.json resolves a filename that must
      # still exist. Fail loudly here rather than 404 in someone's tab.
      - name: Assert retention
        run: |
          for pattern in 'quakes-*.parquet' 'majors-*.parquet'; do
            n=$(ls -1 $pattern | wc -l)
            echo "$pattern -> $n"
            [ "$n" -ge 1 ] && [ "$n" -le 3 ] || { echo "expected 1-3, got $n"; exit 1; }
          done

      - name: Commit if changed
        run: |
          git config user.name  "archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A 'quakes-*.parquet' 'majors-*.parquet' manifest.json
          git diff --staged --quiet || \
            git commit -m "archive: refresh through $(date -u +%F)"
          git push

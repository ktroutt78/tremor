[build]
  publish = "."

# Netlify's default is `max-age=0, must-revalidate` on everything, which would
# make the immutable-Parquet design silently inert. The two rules below are the
# whole caching contract:
#
#   manifest.json      never cached — it names the current Parquet, so a stale
#                      copy pins the client to a file that may be pruned away.
#   quakes-*.parquet   content-addressed by build date; the bytes behind a given
#   majors-*.parquet   filename never change, so cache them for a year.
#
# refresh-archive.yml retains 3 builds of each, so a client holding a manifest
# up to two refreshes old still resolves to a file that exists.

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/quakes-*.parquet"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/majors-*.parquet"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSP notes:
#   script-src   'self' covers app.js (the app was extracted out of an inline
#                <script type="module"> precisely so no hash or 'unsafe-inline'
#                is needed here). unpkg serves deck.gl; jsdelivr serves the
#                duckdb-wasm ESM entry. 'wasm-unsafe-eval' + blob: are what
#                DuckDB-WASM needs to instantiate its module and spawn its
#                worker from a generated blob URL.
#   connect-src  jsdelivr for the .wasm bundle fetch, USGS for the live feeds,
#                'self' for manifest.json / the Parquets / land.geojson,
#                blob: for the worker bootstrap, and extensions.duckdb.org —
#                DuckDB-WASM lazily downloads its json and parquet extensions
#                from there on first use. Omitting it does not fail loudly: the
#                page boots, then every read_json/read_parquet call dies with
#                "Table with name live does not exist" and the boot overlay
#                never clears. A local server sends no CSP, so this only ever
#                reproduces in production.
#   style-src    'unsafe-inline' is load-bearing — the page ships one <style>
#                block plus inline style attributes on the legend swatches.
#   img-src      basemaps.cartocdn.com serves the dark_nolabels raster tiles
#                that fade in past zoom 4.6. Below that the basemap is still
#                land.geojson drawn as a polygon layer; the tiles exist because
#                a 1:50m silhouette has nothing left to show at city zoom.
#                connect-src carries it too — loaders.gl fetches tile images
#                rather than assigning them to an Image element, so an img-src
#                entry alone is not enough and the failure is a silently blank
#                basemap, not an error.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'wasm-unsafe-eval' blob:; worker-src blob:; connect-src 'self' https://cdn.jsdelivr.net https://extensions.duckdb.org https://earthquake.usgs.gov https://*.basemaps.cartocdn.com https://services.arcgisonline.com blob:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://services.arcgisonline.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
